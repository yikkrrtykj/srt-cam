# SRT-CAM v2 Production Reference Compose
# - Data plane channels remain strictly isolated (1 container = 1 channel = 1 blast radius).
# - Native JSON stats enabled by default (-stats:1500 -statspf:json) with bounded log rotation.
# - Control plane (srt-camd) runs separately via systemd or its own container; restarting it never drops media.

x-srt-relay-base: &srt-relay-base
  image: local-srt-gateway:v2
  build:
    context: ..
    dockerfile: deploy/Dockerfile.relay
  network_mode: "host"
  restart: always
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "3"

x-srt-pass-base: &srt-pass-base
  image: local-srt-pass:v2
  build:
    context: ..
    dockerfile: deploy/Dockerfile.pass
  network_mode: "host"
  restart: always
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "2"

services:
  # =========================================================================
  # Mode A: Dual-Caller SRT Relay (2111x ingest -> 1111x egress)
  # Suitable for vMix, rapid setup without receiver port-forwarding, and
  # dual-hardware redundancy (Encoder#1/2 -> VPS#1/2 -> Decoder#1/2).
  # PREVIEW_HTTP_ADDR exposes a loopback-only on-demand /ts tap for 5s
  # keyframe thumbnails (0% overhead when nobody has the dashboard open).
  # Remove PREVIEW_HTTP_ADDR on any channel to exec raw srt-live-transmit.
  # =========================================================================
  srt-cam1:
    <<: *srt-relay-base
    container_name: srt-cam1
    environment:
      - PREVIEW_HTTP_ADDR=127.0.0.1:29111
    command: ["-stats:250", "-statspf:json", "srt://:21111?rcvbuf=33554432", "srt://:11111?rcvbuf=33554432"]

  srt-cam2:
    <<: *srt-relay-base
    container_name: srt-cam2
    environment:
      - PREVIEW_HTTP_ADDR=127.0.0.1:29112
    command: ["-stats:250", "-statspf:json", "srt://:21112?rcvbuf=33554432", "srt://:11112?rcvbuf=33554432"]

  srt-cam3:
    <<: *srt-relay-base
    container_name: srt-cam3
    environment:
      - PREVIEW_HTTP_ADDR=127.0.0.1:29113
    command: ["-stats:250", "-statspf:json", "srt://:21113?rcvbuf=33554432", "srt://:11113?rcvbuf=33554432"]

  srt-cam4:
    <<: *srt-relay-base
    container_name: srt-cam4
    environment:
      - PREVIEW_HTTP_ADDR=127.0.0.1:29114
    command: ["-stats:250", "-statspf:json", "srt://:21114?rcvbuf=33554432", "srt://:11114?rcvbuf=33554432"]

  srt-cam5:
