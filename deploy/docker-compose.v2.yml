  # =========================================================================
  # Mode B (Optional): Pure L4 UDP Passthrough for Makito X4 Path Redundancy
  # Deploy identical channel IDs on VPS-A (Path 1) and VPS-B (Path 2) pointing
  # to the Makito X4 Decoder's Listener public IP + Port 1 / Redundancy Port 2.
  # Uncomment and replace <DECODER_PUBLIC_IP> when enabling Mode B channels.
  # =========================================================================
  # srt-pass1:
  #   <<: *srt-pass-base
  #   container_name: srt-pass1
  #   command:
  #     - "--id=srt-pass1"
  #     - "--listen=:31111"
  #     - "--target=<HUB_DECODER_PUBLIC_IP>:41111"
  #     - "--metrics=127.0.0.1:19101"
  #
  # srt-pass2:
  #   <<: *srt-pass-base
  #   container_name: srt-pass2
  #   command:
  #     - "--id=srt-pass2"
  #     - "--listen=:31112"
  #     - "--target=<VENUE_DECODER_PUBLIC_IP>:41111"
  #     - "--metrics=127.0.0.1:19102"
