name: CI
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install.sh
      - name: Python syntax and unit tests
        run: |
          python3 -m py_compile srt-status
          python3 -m unittest discover -s tests -v
      - name: Expected compose layout
        run: |
          python3 tests/check_compose.py

  go-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build TypeScript frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go unit tests and zero-CGO single-binary build
        run: |
          go test -v ./...
          CGO_ENABLED=0 go build -o /tmp/srt-camd ./cmd/srt-camd
          CGO_ENABLED=0 go build -o /tmp/srt-passd ./cmd/srt-passd
